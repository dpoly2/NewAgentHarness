version: "3.9"

services:

  hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archonhub
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Persist DB, memory, agent data, evidence files, and vector store
      - archonhub_memory:/app/memory
      - archonhub_data:/app/data
      - archonhub_uploads:/app/uploads
      - archonhub_chroma:/app/chroma_db
    env_file:
      - .agents/.env
    environment:
      - HUB_HOST=0.0.0.0
      - HUB_PORT=8765
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  archonhub_memory:
  archonhub_data:
  archonhub_uploads:
  archonhub_chroma:
