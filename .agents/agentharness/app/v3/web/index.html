                        <div id="convDetailContent" style="white-space:pre-wrap;font-size:12px;background:var(--bg-input);border-radius:6px;padding:12px;max-height:400px;overflow-y:auto"></div>
                    </div>`,
                    `<button class="action-btn" onclick="showAgents()">🔄 Refresh</button>`
                );

                // Wire collaborate button
                $('#collaborateBtn').addEventListener('click', async () => {
                    const query = $('#agentQuery').value.trim();
                    if (!query) { showToast('Enter a query first', 'var(--warning)'); return; }
                    const sel = $('#agentSelect');
                    const selectedAgents = sel ? Array.from(sel.selectedOptions).map(o => o.value) : [];
                    $('#collaborateBtn').disabled = true;
                    $('#collaborateBtn').textContent = 'Working…';
                    const resultDiv = $('#collaborateResult');
                    resultDiv.style.display = 'block';
                    resultDiv.textContent = 'Sending to agents…';
                    try {
                        const payload = { query };
                        if (selectedAgents.length) payload.agents = selectedAgents;
                        const result = await api('POST', '/api/agents/collaborate', payload);
                        const synthesis = result?.synthesis?.synthesized_response || result?.response || result?.result || JSON.stringify(result, null, 2);
                        const agentsUsed = result?.agents_involved || [];
                        resultDiv.textContent = (agentsUsed.length ? `Agents: ${agentsUsed.join(', ')}\n${'─'.repeat(50)}\n\n` : '') + synthesis;
                        await showAgents();
                    } catch (e) {
                        resultDiv.textContent = 'Error: ' + (e.message || 'Collaboration failed');
                        $('#collaborateBtn').disabled = false;
                        $('#collaborateBtn').textContent = '▶ Collaborate';
                    }
                });

                // Wire row clicks for conversation detail
                document.querySelectorAll('#convTableBody tr[data-conv-id]').forEach(row => {
                    row.addEventListener('click', async () => {
                        const cid = row.dataset.convId;
                        try {
                            const resp = await api('GET', `/api/agents/conversations/${cid}`);
                            const conv = resp?.conversation || {};
                            const messages = conv.messages || [];
                            const panel = $('#convDetailPanel');
                            const title = $('#convDetailTitle');
                            const content = $('#convDetailContent');
                            title.textContent = `Goal: ${(conv.goal||'').slice(0,80)}`;
                            const lines = [
                                `Agents: ${(conv.participant_agents||[]).join(', ')}`,
                                `Status: ${conv.status}  |  Messages: ${conv.message_count || 0}`,
                                '─'.repeat(60), ''
                            ];
                            for (const m of messages) {
                                const p = m.payload || {};
                                const body = p.response || p.query || JSON.stringify(p).slice(0,200);
                                lines.push(`[${m.sender_agent} → ${m.recipient_agent}] (${m.status})`);
                                lines.push(`  ${body}`);
                                lines.push('');
                            }
                            content.textContent = lines.join('\n') || '(no messages)';
                            panel.style.display = 'block';
                            panel.scrollIntoView({ behavior: 'smooth' });
                        } catch (e) {
                            showToast('Load error: ' + e.message, 'var(--error)');
                        }
                    });
                });
            } catch (error) {
                renderShell('Agents', 'Multi-agent collaboration.',
                    `<div class="error-banner">${escapeHtml(error.message || 'Unable to load agents')}</div>`);
            }
        }

        async function showModels() {
            if (!(await requireAuth())) return;
            setLoading('Models', 'Loading model catalog…');
            try {
                const [catalog, providers] = await Promise.all([
                    api('GET', '/api/models'),
                    api('GET', '/api/models/providers').catch(() => [])
                ]);
                const provMap = {};
                (providers || []).forEach(p => { provMap[p.provider] = p; });

                // Group by provider
                const grouped = {};
                (catalog || []).forEach(m => {
                    if (!grouped[m.provider]) grouped[m.provider] = [];
                    grouped[m.provider].push(m);
                });

                const TIER_COLORS = { premium: 'var(--warning)', standard: 'var(--accent)', economy: 'var(--text-muted)', local: 'var(--success)' };
                const PROV_ICONS = { openai: '⬡', anthropic: '◈', gemini: '◉', groq: '⚡', perplexity: '◎', github: '⌥', ollama: '◆' };
                const TASK_TYPES = ['reasoning','code','fast','long_context','vision','search','finance','writing','agents'];

                const providerCards = Object.entries(grouped).map(([prov, models]) => {
                    const pi = provMap[prov] || {};
                    const hasKey = pi.key_configured;
                    const enabledCount = models.filter(m => m.enabled).length;
                    const icon = PROV_ICONS[prov] || '•';
                    const keyBadge = hasKey
                        ? `<span style="color:var(--success);font-size:11px">✓ key set</span>`
                        : `<span style="color:var(--error);font-size:11px">✗ no key</span>`;
                    const rows = models.map(m => {
                        const key = m.key || `${prov}__${m.model_id}`;
                        const caps = (m.capabilities || []).slice(0, 4).map(c =>
                            `<span style="background:var(--bg-hover);color:var(--text-muted);font-size:10px;padding:1px 5px;border-radius:3px;margin:0 2px">${c}</span>`
                        ).join('');
                        const tierColor = TIER_COLORS[m.tier] || 'var(--text-muted)';
                        return `<tr>
                            <td>
                                <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                                    <input type="checkbox" ${m.enabled ? 'checked' : ''} data-key="${escapeHtml(key)}" data-prov="${escapeHtml(prov)}" data-model="${escapeHtml(m.model_id)}" style="cursor:pointer">
                                    <span style="font-weight:500">${escapeHtml(m.display || m.model_id)}</span>
                                </label>
                            </td>
                            <td class="muted" style="font-size:11px">${m.context_k ? m.context_k + 'k' : '—'}</td>
                            <td><span style="color:${tierColor};font-size:11px">${m.tier || ''}</span></td>
                            <td>${caps}</td>
                        </tr>`;
                    }).join('');
                    return `<div class="card" style="margin-bottom:14px" id="prov-card-${prov}">
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                            <span style="font-size:18px">${icon}</span>
                            <strong style="font-size:15px">${prov.toUpperCase()}</strong>
                            ${keyBadge}
                            <span class="muted" style="font-size:11px;margin-left:auto">${enabledCount}/${models.length} enabled</span>
                        </div>
                        <div class="table-wrap" style="padding:0">
                        <table>
                            <thead><tr><th>Model</th><th>Context</th><th>Tier</th><th>Capabilities</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                        </div>
                    </div>`;
                }).join('');

                const routeOptions = TASK_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');

                renderShell('Models', 'Browse, enable/disable LLM models by provider.',
                    `<div class="card" style="margin-bottom:18px">
                        <h3>🔀 Route Tester</h3>
                        <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
                            <select id="routeTaskType" style="background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px">
                                <option value="">— pick task type —</option>
                                ${routeOptions}
                            </select>
                            <button class="action-btn" id="routeTestBtn">Find Best Model</button>
                            <span id="routeResult" class="muted" style="font-size:13px"></span>
                        </div>
                    </div>
                    ${providerCards}`,
                    `<button class="action-btn primary" id="saveModelsBtn">💾 Save Changes</button>
                     <button class="action-btn" onclick="showModels()">🔄 Refresh</button>`
                );

                // Route tester
                $('#routeTestBtn').addEventListener('click', async () => {
                    const taskType = $('#routeTaskType').value;
                    if (!taskType) { showToast('Pick a task type', 'var(--warning)'); return; }
                    try {
                        const result = await api('POST', '/api/models/route', { task_type: taskType });
                        const el = $('#routeResult');
                        if (result) {
                            el.style.color = 'var(--success)';
                            el.textContent = `→ ${result.display || result.model_id} (${result.provider})`;
                        } else {
                            el.style.color = 'var(--error)';
                            el.textContent = 'No enabled model found for this task';
                        }
                    } catch (e) {
                        $('#routeResult').textContent = 'Error: ' + e.message;
                    }
                });

                // Save toggles (admin only — best effort)
                $('#saveModelsBtn').addEventListener('click', async () => {
                    const checkboxes = document.querySelectorAll('[data-key]');
                    let saved = 0, failed = 0;
                    for (const cb of checkboxes) {
                        const enabled = cb.checked;
                        const prov = cb.dataset.prov;
                        const model = cb.dataset.model;
                        try {
                            await api('PUT', '/api/models/toggle', { provider: prov, model_id: model, enabled });
                            saved++;
                        } catch (e) {
                            failed++;
                        }
                    }
                    showToast(`Saved ${saved} model states${failed ? `, ${failed} failed (admin only)` : ''}`,
                        failed ? 'var(--warning)' : 'var(--success)');
                });

            } catch (error) {
                renderShell('Models', 'LLM Model Catalog.',
                    `<div class="error-banner">${escapeHtml(error.message || 'Unable to load models')}</div>`);
            }
        }

        function renderMessagesMarkup() {
            if (!state.currentConversationId) return emptyState('No conversation selected', 'Create or select a conversation to see messages.');
            if (!state.messages.length) return emptyState('No messages yet', 'Send the first message to start the conversation.');
            return state.messages.map((message) => {
                const role = message.role === 'user' ? 'user' : 'agent';
                return `
                    <div class="bubble ${role}">
                        ${escapeHtml(message.content || '')}
                        <small>${escapeHtml(role === 'user' ? 'You' : (message.agent_id || 'Agent'))} · ${fmtDateTime(message.created_at)}</small>
                    </div>
                `;
            }).join('');
        }

        function renderMessages() {
            const container = $('#chatMessages');
            if (!container) return;
            container.innerHTML = renderMessagesMarkup();
            scrollChatToBottom();
        }

        function scrollChatToBottom() {
            const container = $('#chatMessages');
            if (container) container.scrollTop = container.scrollHeight;
        }

        function openConversationModal() {
            openModal('New Conversation', `
                <form id="newConversationForm" class="form-grid">
                    <div class="field span-2"><label>Title</label><input name="title" required /></div>
                    <div class="field span-2"><label>Slug</label><input name="slug" placeholder="optional-slug" /></div>
                    <div class="form-actions span-2">

                        <button class="action-btn" type="submit">Create Conversation</button>
                    </div>
                </form>
            `);

            $('#newConversationForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                try {
                    const created = await api('POST', '/api/conversations', Object.fromEntries(new FormData(event.currentTarget).entries()));
                    state.currentConversationId = created?.id || created?.conversation_id || state.currentConversationId;
                    closeModal();
                    showToast('Conversation created', 'var(--success)');
                    showChat();
                } catch (error) {
                    showToast(error.message || 'Unable to create conversation', 'var(--error)');

        async function showChat() {
            if (!(await requireAuth())) return;
            setLoading('Chat', 'Loading conversations…');
            try {
                const convoResponse = await api('GET', '/api/conversations');
                state.conversations = asArray(convoResponse, ['conversations']);
                if (!state.currentConversationId && state.conversations.length) state.currentConversationId = state.conversations[0].id;
                if (state.currentConversationId) {
                    const msgResponse = await api('GET', `/api/conversations/${encodeURIComponent(state.currentConversationId)}/messages`);
                    state.messages = asArray(msgResponse, ['messages']);
                } else {
                    state.messages = [];
                }
                renderShell(
                    'Chat',
                    'Collaborate with agents in real time.',
                    `
                        <div class="chat-shell">
                            <div class="chat-sidebar">
                                <div class="toolbar">
                                    <button class="action-btn" id="newConversationBtn">New Conversation</button>
                                </div>
                                <div class="chat-list" id="chatList">
                                    ${state.conversations.length ? state.conversations.map((conversation) => `
                                        <div class="chat-convo ${conversation.id === state.currentConversationId ? 'active' : ''}" data-id="${escapeHtml(conversation.id)}">
                                            <strong>${escapeHtml(conversation.title || 'Untitled Conversation')}</strong>
                                            <div class="muted">${fmtRelative(conversation.updated_at || conversation.created_at)}</div>
                                        </div>
                                    `).join('') : emptyState('No conversations', 'Create a conversation to start chatting.')}
                                </div>
                            </div>
                            <div class="chat-main">
                                <div class="chat-header">
                                    <div>
                                        <strong>${escapeHtml(state.conversations.find((item) => item.id === state.currentConversationId)?.title || 'No conversation selected')}</strong>
                                        <div class="muted">Real-time updates sync through WebSocket.</div>
                                    </div>
                                    <div class="chip-row">
                                        <span class="chip">${escapeHtml(state.currentConversationId || 'None')}</span>
                                    </div>
                                </div>
                                <div class="chat-messages" id="chatMessages">${renderMessagesMarkup()}</div>
                                <form class="chat-input" id="chatForm">
                                    <textarea id="chatMessageInput" placeholder="Send a message to ArchonHub…" ${state.currentConversationId ? '' : 'disabled'}></textarea>
                                    <button class="action-btn" type="submit" ${state.currentConversationId ? '' : 'disabled'}>Send</button>
                                </form>
                            </div>
                        </div>
                    `,
                    `<button class="action-btn" id="chatRefreshBtn">Refresh Chat</button>`
                );
                $('#chatRefreshBtn').addEventListener('click', showChat);
                $('#newConversationBtn').addEventListener('click', openConversationModal);
                $$('.chat-convo').forEach((item) => item.addEventListener('click', async () => {
                    state.currentConversationId = item.dataset.id;
                    await showChat();
                }));
                $('#chatForm').addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const input = $('#chatMessageInput');
                    const content = input.value.trim();
                    if (!content || !state.currentConversationId) return;
                    try {
                        await api('POST', `/api/conversations/${encodeURIComponent(state.currentConversationId)}/messages`, { role: 'user', content });
                        input.value = '';
                        await showChat();
                    } catch (error) {
                        showToast(error.message || 'Unable to send message', 'var(--error)');
                    }
                });
                requestAnimationFrame(scrollChatToBottom);
            } catch (error) {
                renderShell('Chat', 'Collaborate with agents in real time.', `<div class="error-banner">${escapeHtml(error.message || 'Unable to load chat')}</div>`);
            }
        }

        function renderInezMessages() {

        function scrollInezToBottom() {

        async function showInez() {
            if (!(await requireAuth())) return;
            const hubOnlineBadge = state.hubOnline
                ? `<span style="color:var(--success);font-size:12px;">● Hub connected</span>`
                : `<span style="color:var(--warning);font-size:12px;">● Local mode</span>`;

            renderShell('Inez', 'Chief of Staff — Smith Capital Portfolio', `
                <div class="inez-shell">
                    <div class="inez-header">
                        <div class="inez-avatar">👑</div>
                        <div>
                            <div class="inez-name">Inez</div>
                            <div class="inez-subtitle">Chief of Staff · Smith Capital Portfolio</div>
                        </div>
                        <div style="margin-left:auto;">${hubOnlineBadge}</div>
                    </div>
                    <div class="inez-messages" id="inezMessages">
                        ${renderInezMessages()}
                        ${renderInezThinking()}
                    </div>
                    <form class="inez-input" id="inezForm">
                        <textarea id="inezInput" placeholder="Ask Inez anything..." rows="2"></textarea>
                        <button type="submit" class="inez-send-btn" id="inezSendBtn">Send</button>
                    </form>
                </div>
            `);

            if (!state.inezMessages.length) {
                state.inezMessages.push({
                    role: 'inez',
                    content: "Good to see you. I'm Inez — your Chief of Staff. What do you need?",
                    dispatches: [],
                    ts: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                $('#inezMessages').innerHTML = renderInezMessages() + renderInezThinking();
            }

            requestAnimationFrame(scrollInezToBottom);

            $('#inezForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                const input = $('#inezInput');
                const content = (input.value || '').trim();
                if (!content || state.inezThinking) return;

                input.value = '';
                const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                state.inezMessages.push({ role: 'user', content, dispatches: [], ts });
                state.inezThinking = true;
                const btn = $('#inezSendBtn');
                if (btn) btn.disabled = true;

                // Re-render
                const msgEl = $('#inezMessages');
                if (msgEl) {
                    msgEl.innerHTML = renderInezMessages() + renderInezThinking();
                    scrollInezToBottom();
                }

                try {
                    const result = await api('POST', '/api/inez/chat', {
                        message: content,
                        conversation_id: state.inezConversationId || null
                    });
                    state.inezConversationId = result.conversation_id || state.inezConversationId;
                    state.inezThinking = false;
                    const rts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    state.inezMessages.push({
                        role: 'inez',
                        content: result.inez_message || '',
                        dispatches: result.dispatches || [],
                        ts: rts
                    });
                } catch (err) {
                    state.inezThinking = false;
                    state.inezMessages.push({
                        role: 'inez',
                        content: `I ran into an issue: ${err.message || 'Unknown error'}`,
                        dispatches: [],
                        ts: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                }

                const msgEl2 = $('#inezMessages');
                if (msgEl2) {
                    msgEl2.innerHTML = renderInezMessages() + renderInezThinking();
                    scrollInezToBottom();
                }
                if (btn) btn.disabled = false;
            });

            // Allow Enter to submit (Shift+Enter = newline)
            $('#inezInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    $('#inezForm').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
                }
            });
        }

        function renderPlanSVG(plan) {
            const nodes = plan.nodes || [];
            const edges = plan.edges || [];
            if (!nodes.length) return '<p style="padding:20px;color:#6b7a99">No nodes defined.</p>';

            const NODE_W = 160, NODE_H = 48, PAD_X = 40, PAD_Y = 60;
            const statusColorMap = { pending:'#4a5568', ready:'#2d84ff', running:'#2d84ff', done:'#00c864', blocked:'#ff4444', skipped:'#4a5568' };
            const statusFillMap = { pending:'#1c2230', ready:'#1a2744', running:'#1a2744', done:'#0a2a1a', blocked:'#2a1010', skipped:'#1c2230' };
            const parallelStages = plan.preflight_report?.parallel_stages || [];
            const levels = {};
            const inDeg = {};
            const adj = {};

            nodes.forEach((node) => { inDeg[node.id] = 0; adj[node.id] = []; });
            nodes.forEach((node) => (node.depends_on || []).forEach((dep) => { if (inDeg[dep] !== undefined) inDeg[node.id] += 1; }));
            edges.forEach((edge) => { if (adj[edge.from_node]) adj[edge.from_node].push(edge.to_node); });

            const roots = nodes.filter((node) => inDeg[node.id] === 0).map((node) => node.id);
            roots.forEach((nodeId) => { levels[nodeId] = 0; });
            const queue = [...roots];
            while (queue.length) {
                const current = queue.shift();
                (adj[current] || []).forEach((child) => {
                    if (levels[child] === undefined || levels[child] <= levels[current]) {
                        levels[child] = levels[current] + 1;
                        queue.push(child);
                    }
                });
            }
            nodes.forEach((node) => { if (levels[node.id] === undefined) levels[node.id] = 0; });

            const byLevel = {};
            nodes.forEach((node) => {
                byLevel[levels[node.id]] = byLevel[levels[node.id]] || [];
                byLevel[levels[node.id]].push(node);
            });
            const numericLevels = Object.keys(byLevel).map(Number);
            const maxLevel = numericLevels.length ? Math.max(...numericLevels) : 0;
            const svgH = (maxLevel + 1) * (NODE_H + PAD_Y) + PAD_Y;
            const maxPerLevel = Math.max(...Object.values(byLevel).map((group) => group.length));
            const svgW = Math.max(600, maxPerLevel * (NODE_W + PAD_X) + PAD_X * 2);
            const pos = {};

            Object.entries(byLevel).forEach(([level, levelNodes]) => {
                const y = PAD_Y + Number(level) * (NODE_H + PAD_Y);
                const totalW = levelNodes.length * NODE_W + Math.max(0, levelNodes.length - 1) * PAD_X;
                const startX = (svgW - totalW) / 2;
                levelNodes.forEach((node, index) => {
                    pos[node.id] = { x: startX + index * (NODE_W + PAD_X), y };
                });
            });

            const edgeSvg = edges.map((edge) => {
                const from = pos[edge.from_node];
                const to = pos[edge.to_node];
                if (!from || !to) return '';
                const x1 = from.x + NODE_W / 2;
                const y1 = from.y + NODE_H;
                const x2 = to.x + NODE_W / 2;
                const y2 = to.y;
                const dash = edge.kind === 'dependency' ? 'stroke-dasharray="6 3"' : '';
                const color = edge.kind === 'handoff' ? '#a78bfa' : '#4a5568';
                return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.5" ${dash} marker-end="url(#arrowhead)"/>`;
            }).join('');

            // TODO: Migrate to React Flow (https://reactflow.dev)
            // Decision: Replace this SVG canvas with a React Flow component.
            // Migration plan:
            //   1. Add a React build step (Vite/Next.js) for the web/ dashboard
            //   2. Install: npm install reactflow
            //   3. Replace renderPlanSVG() with <ReactFlow nodes={...} edges={...} />
            //   4. Use ReactFlow's built-in ELK/Dagre layout for auto-positioning
            //   5. Node types: WorkNode, ReviewNode, DecisionNode, HumanGateNode, MilestoneNode
            //   6. Edge types: sequence (solid), dependency (dashed), handoff (purple)
            //   7. Custom node components show status ring, evidence count badge, agent avatar
            // Current: functional SVG canvas used until React build is set up.
            const stageBgs = Object.entries(byLevel).map(([lvl, ns]) => {
                if (ns.length < 2) return '';
                const ys = ns.map((n) => pos[n.id]?.y).filter((y) => y !== undefined);
                if (!ys.length) return '';
                const minY = Math.min(...ys) - 6;
                const stageW = svgW - PAD_X;
                return `<rect x="${PAD_X/2}" y="${minY}" width="${stageW}" height="${NODE_H + 12}"
                        rx="4" fill="rgba(45,132,255,0.04)" stroke="rgba(45,132,255,0.1)" stroke-dasharray="4 3" stroke-width="1"/>
                        <text x="${PAD_X/2 + 4}" y="${minY + 12}" font-size="10" fill="rgba(45,132,255,0.4)">parallel</text>`;
            }).join('');
            const stageLabels = Object.entries(byLevel).map(([lvl, ns], index) => {
                const y = pos[ns[0]?.id]?.y;
                if (y === undefined) return '';
                const fromPreflight = parallelStages[Number(lvl)]?.length ? ` (${parallelStages[Number(lvl)].length} node${parallelStages[Number(lvl)].length === 1 ? '' : 's'})` : '';
                return `<text x="8" y="${y + 16}" font-size="11" fill="rgba(160,174,192,0.7)">Stage ${index + 1}${fromPreflight}</text>`;
            }).join('');
            const nodeSvg = nodes.map((node) => {
                const p = pos[node.id];
                if (!p) return '';
                const fill = statusFillMap[node.status] || '#1c2230';
                const stroke = statusColorMap[node.status] || '#4a5568';
                const label = String(node.label || '').length > 20 ? `${String(node.label).slice(0, 19)}…` : String(node.label || '');
                const icon = node.status === 'done' ? '✓ ' : node.status === 'blocked' ? '✗ ' : node.role === 'human_gate' ? '👤 ' : '';
                return `<g class="plan-node status-${escapeHtml(node.status || 'pending')} role-${escapeHtml(node.role || 'work')}" data-node-id="${escapeHtml(node.id)}" transform="translate(${p.x},${p.y})">
                    <rect width="${NODE_W}" height="${NODE_H}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
                    <text x="${NODE_W / 2}" y="18" text-anchor="middle" font-size="11" fill="#a0aec0">${escapeHtml(node.role || 'work')}</text>
                    <text x="${NODE_W / 2}" y="34" text-anchor="middle" font-size="12" fill="#e8eaf0" font-weight="600">${escapeHtml(icon + label)}</text>
                </g>`;
            }).join('');

            return `<svg viewBox="0 0 ${svgW} ${svgH}" style="min-height:${Math.max(180, svgH)}px">
                <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5568"/></marker></defs>
                ${stageBgs}${stageLabels}${edgeSvg}${nodeSvg}
            </svg>`;
        }

        function renderPlanNodeList(plan) {
            const nodes = plan.nodes || [];
            return `<h3>Nodes</h3><table><thead><tr><th>ID</th><th>Role</th><th>Agent</th><th>Status</th><th>Evidence</th></tr></thead><tbody>${nodes.map((node) => `
                <tr>
                    <td><strong>${escapeHtml(node.id)}</strong><br><small style="color:#6b7a99">${escapeHtml((node.purpose || '').slice(0, 60))}</small></td>
                    <td>${escapeHtml(node.role || 'work')}</td>
                    <td>${escapeHtml(node.agent_id || '—')}</td>
                    <td>${planStatusBadge(node.status || 'pending')}${node.blocked_reason ? `<br><small style="color:var(--error)">${escapeHtml(node.blocked_reason)}</small>` : ''}</td>
                    <td>${(node.evidence || []).length} item(s)</td>
                </tr>
            `).join('')}</tbody></table>`;
        }

        function showNodeEvidence(plan, nodeId) {
            const node = (plan.nodes || []).find((item) => item.id === nodeId);
            if (!node) return;
            const panel = $('#planEvidencePanel');
            if (!panel) return;
            const evidence = node.evidence || [];
            panel.innerHTML = `<div class="plan-evidence-panel">
                <h3 style="margin:0 0 12px">Evidence — ${escapeHtml(node.label)}</h3>
                ${!evidence.length ? '<p style="color:#6b7a99">No evidence yet.</p>' : evidence.map((item) => `
                    <div class="plan-evidence-item type-${escapeHtml(item.type)}">
                        <div style="display:flex;justify-content:space-between;margin-bottom:4px;gap:12px;flex-wrap:wrap">
                            <strong>${escapeHtml(item.type)}</strong>
                            <span style="color:#6b7a99;font-size:11px">${escapeHtml(item.source)} · ${fmtRelative(item.timestamp)}</span>
                        </div>
                        <pre style="margin:0;white-space:pre-wrap;font-size:12px;color:#a0aec0">${escapeHtml((item.content || '').slice(0, 800))}</pre>
                        ${item.ref ? `<a href="${escapeHtml(item.ref)}" target="_blank" style="font-size:11px;color:#2d84ff">↗ Reference</a>` : ''}
                    </div>
                `).join('')}
                <button class="ghost-btn" style="margin-top:8px" id="closePlanEvidenceBtn">✕ Close</button>
            </div>`;
            $('#closePlanEvidenceBtn')?.addEventListener('click', () => { panel.innerHTML = ''; });
        }

        async function runPreflight(planId) {
            showToast('Running preflight…', 'var(--accent)');
            try {
                const data = await api('POST', `/api/plans/${planId}/preflight`);
                showToast(data.report?.passed ? 'Preflight passed ✅' : 'Preflight found issues ⚠', data.report?.passed ? 'var(--success)' : 'var(--warning)');
                showPlanDetail(planId);
            } catch (error) {
                showToast(`Preflight error: ${error.message || error}`, 'var(--error)');
            }
        }

        async function approvePlan(planId) {
            if (!confirm('Approve this plan for execution?')) return;
            try {
                await api('POST', `/api/plans/${planId}/approve`);
                showToast('Plan approved', 'var(--success)');
                showPlanDetail(planId);
            } catch (error) {
                showToast(`Error: ${error.message || error}`, 'var(--error)');
            }
        }

        async function executePlan(planId) {
            if (!confirm('Start execution of this plan?')) return;
            try {
                const data = await api('POST', `/api/plans/${planId}/execute`);
                showToast(`Execution started — run ${shortId(data.run_id, 8)}`, 'var(--success)');
                showPlanDetail(planId);
            } catch (error) {
                showToast(`Error: ${error.message || error}`, 'var(--error)');
            }
        }

        async function abandonPlan(planId) {
            if (!confirm('Abandon this plan?')) return;
            try {
                await api('POST', `/api/plans/${planId}/abandon`);
                showToast('Plan abandoned', 'var(--warning)');
                showPlans();
            } catch (error) {
                showToast(`Error: ${error.message || error}`, 'var(--error)');
            }
        }

        async function approveDrift(planId) {
            if (!confirm('Approve drift and add new nodes to plan?')) return;
            try {
                const data = await api('POST', `/api/plans/${planId}/drift/approve`);
                showToast(`Drift approved — plan v${data.new_version}`, 'var(--success)');
                showPlanDetail(planId);
            } catch (error) {
                showToast(`Error: ${error.message || error}`, 'var(--error)');
            }
        }

        async function rejectDrift(planId) {
            const reason = prompt('Rejection reason (optional):') || '';
            try {
                await api('POST', `/api/plans/${planId}/drift/reject`, { rejection_reason: reason });
                showToast('Drift rejected — execution resumes', 'var(--warning)');
                showPlanDetail(planId);
            } catch (error) {
                showToast(`Error: ${error.message || error}`, 'var(--error)');
            }
        }

        async function showCreatePlan() {
            renderShell(
                'Plans',
                'Create a new implementation plan graph.',
                `
                    <div class="panel section-stack">
                        <div class="field"><label for="newPlanTitle">Title</label><input id="newPlanTitle" placeholder="Implement feature X" /></div>
                        <div class="field"><label for="newPlanObjective">Objective</label><textarea id="newPlanObjective" rows="2" placeholder="What this plan achieves"></textarea></div>
                        <div class="field"><label for="newPlanProject">Project</label><input id="newPlanProject" placeholder="project-slug" /></div>
                        <div class="tab-bar">
                            <button class="tab-btn active" id="tabJsonBtn" onclick="switchPlanTab('json')">JSON</button>
                            <button class="tab-btn" id="tabYamlBtn" onclick="switchPlanTab('yaml')">YAML</button>
                        </div>
                        <div id="tabJsonContent">
                            <div class="field"><label for="newPlanNodes">Nodes (JSON array)</label><textarea id="newPlanNodes" rows="10" style="font-family:monospace;margin-bottom:12px" placeholder='[{"id":"step1","label":"First step","purpose":"Do the first thing","agent_id":"human","exit_criteria":["step done"]}]'></textarea></div>
                            <div class="field"><label for="newPlanEdges">Edges (JSON array, optional)</label><textarea id="newPlanEdges" rows="4" style="font-family:monospace;margin-bottom:16px" placeholder='[{"from_node":"step1","to_node":"step2","kind":"sequence"}]'></textarea></div>
                        </div>
                        <div id="tabYamlContent" style="display:none">
                            <div class="field"><label for="newPlanYaml">YAML Plan Definition</label><textarea id="newPlanYaml" rows="16" style="font-family:monospace;margin-bottom:16px" placeholder="title: My Plan&#10;objective: What this achieves&#10;project: my-project&#10;nodes:&#10;  - id: step1&#10;    label: First Step&#10;    purpose: Do the first thing&#10;    agent: human&#10;    exit:&#10;      - step is done&#10;  - id: step2&#10;    label: Second Step&#10;    purpose: Do the second thing&#10;    agent: my-agent&#10;    deps: [step1]&#10;    exit:&#10;      - output verified"></textarea></div>
                        </div>
                        <div class="form-actions">
                            <button class="secondary-btn" id="submitCreatePlanBtn">Create Plan</button>
                            <button class="ghost-btn" id="cancelCreatePlanBtn">Cancel</button>
                        </div>
                    </div>
                `
            );
            $('#submitCreatePlanBtn')?.addEventListener('click', () => submitCreatePlan());
            $('#cancelCreatePlanBtn')?.addEventListener('click', () => showPlans());
        }

        function switchPlanTab(tab) {
            $('#tabJsonContent').style.display = tab === 'json' ? '' : 'none';
            $('#tabYamlContent').style.display = tab === 'yaml' ? '' : 'none';
            $('#tabJsonBtn').classList.toggle('active', tab === 'json');
            $('#tabYamlBtn').classList.toggle('active', tab === 'yaml');
        }

        async function submitCreatePlan() {
            const isYaml = $('#tabYamlContent') && $('#tabYamlContent').style.display !== 'none';
            if (isYaml) {
                const yamlText = $('#newPlanYaml')?.value?.trim();
                if (!yamlText) { showToast('YAML content is required', 'var(--warning)'); return; }
                try {
                    const data = await api('POST', '/api/plans/from-yaml', { yaml_text: yamlText });
                    showToast('Plan created from YAML', 'var(--success)');
                    showPlanDetail(data.plan.plan_id);
                } catch (error) {
                    showToast(`Error: ${error.message || error}`, 'var(--error)');
                }
                return;
            }
            const title = $('#newPlanTitle')?.value?.trim();
            const objective = $('#newPlanObjective')?.value?.trim();
            const project = $('#newPlanProject')?.value?.trim();
            let nodes;
            let edges;
            try { nodes = JSON.parse($('#newPlanNodes')?.value || '[]'); } catch { showToast('Invalid nodes JSON', 'var(--error)'); return; }
            try { edges = JSON.parse($('#newPlanEdges')?.value || '[]'); } catch { showToast('Invalid edges JSON', 'var(--error)'); return; }
            if (!title || !objective || !nodes.length) {
                showToast('Title, objective, and at least one node are required', 'var(--warning)');
                return;
            }
            try {
                const data = await api('POST', '/api/plans', { title, objective, project, nodes, edges });
                showToast('Plan created', 'var(--success)');
                showPlanDetail(data.plan.plan_id);
            } catch (error) {
                showToast(`Error creating plan: ${error.message || error}`, 'var(--error)');
            }
        }

        function handlePlanWSEvent(event) {
            if (!event.type || !String(event.type).startsWith('plan.')) return;
            if (state.currentPage === 'plans' && state.currentPlanId && event.plan_id === state.currentPlanId) {
                if (['plan.node.start', 'plan.node.done', 'plan.node.blocked', 'plan.node.evidence', 'plan.done', 'plan.preflight.done', 'plan.approved', 'plan.drift.proposed', 'plan.drift.approved', 'plan.drift.rejected'].includes(event.type)) {
                    showPlanDetail(state.currentPlanId);
                }
            }
            if (event.type === 'plan.drift.proposed' || event.type === 'plan.drift.approved' || event.type === 'plan.drift.rejected') {
                if (state.currentPlanId && event.plan_id === state.currentPlanId) {
                    showPlanDetail(state.currentPlanId);
                }
                else if (state.currentPage === 'plans') showPlans();
            }
            if (state.currentPage === 'plans' && ['plan.created', 'plan.done', 'plan.abandoned'].includes(event.type) && !state.currentPlanId) {
                showPlans();
            }
        }

        window.addEventListener('hashchange', () => {
            const page = (location.hash || '#/dashboard').replace(/^#\//, '') || 'dashboard';
            if (page !== state.currentPage) navigate(page, true);
        });

        $('#collapseBtn').addEventListener('click', () => {
            if (window.innerWidth <= 760) {
                state.mobileNavOpen ? closeMobileNav() : openMobileNav();
            } else {
                document.body.classList.toggle('sidebar-collapsed');
            }
        });
        $('#mobileMenuBtn').addEventListener('click', () => state.mobileNavOpen ? closeMobileNav() : openMobileNav());
        $('#sidebarBackdrop').addEventListener('click', closeMobileNav);
        window.addEventListener('resize', () => { if (window.innerWidth > 760) closeMobileNav(); });

        renderSidebar();
        updateUserUI();
        setHubStatus(false, 'Hub Offline');
        setWSState('offline', 'WebSocket disconnected');
        if (!state.healthPulseTimer) state.healthPulseTimer = setInterval(refreshHubPulse, 30000);
        bootstrapAuth();
    </script>
</body>
</html>
